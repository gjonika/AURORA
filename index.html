<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AURORA Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header>
      <h1>AURORA Morning Dashboard</h1>
      <div class="search-section">
        <input type="text" id="cityInput" placeholder="Enter city (e.g., vilnius)" />
        <button id="fetchBtn">Get Weather</button>
      </div>
      <p id="weatherError" class="error"></p>
    </header>

    <section id="weatherSection">
      <h2>Current Weather</h2>
      <div class="current-weather card">
        <img id="weatherIcon" src="" alt="" />
        <div class="weather-stats">
          <div id="currentTemp" class="temp-large">--°C</div>
          <div id="weatherCondition" class="description">--</div>
          <div id="weatherLocation" class="location">--</div>
          <div class="wind">💨 <span id="windSpeed">--</span> m/s</div>
        </div>
      </div>

      <h3>24-Hour Forecast</h3>
      <div id="hourlyForecast" class="hourly-forecast"></div>
    </section>

    <section id="nasaSection">
      <h2>NASA Image of the Day</h2>
      <h3 id="nasaTitle"></h3>
      <img id="nasaImage" src="" alt="NASA Astronomy Picture of the Day" />
    </section>

    <section id="quoteSection">
      <h2>Daily Quote</h2>
      <blockquote id="quote"></blockquote>
      <p id="author"></p>
    </section>
  </div>

  <script src="main.js" type="module"></script>
</body>
</html>
