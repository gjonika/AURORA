<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AURORA Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>AURORA Morning Dashboard</h1>
      <input type="text" id="cityInput" placeholder="Enter city (e.g., vilnius)" />
  <button id="fetchBtn">Get Weather</button>
    </header>

  <section id="weatherSection">
  <h2>Weather</h2>
  <div id="currentWeather" class="card">
    <img id="weatherIcon" src="" alt="" />
    <div class="temperature" id="currentTemp">--°C</div>
    <div class="description" id="weatherCondition">Condition</div>
    <div class="location" id="weatherLocation">City</div>
    <div class="wind">💨 <span id="windSpeed">--</span> m/s</div>
  </div>

  <div class="hourly-forecast">
    <h3>24-Hour Forecast</h3>
    <div id="hourlyForecast" class="weather-list"></div>
  </div>
</section>


    <section id="nasaSection">
      <h2>NASA Image of the Day</h2>
      <h3 id="nasaTitle"></h3>
      <img id="nasaImage" src="" alt="NASA Astronomy Picture of the Day" />
    </section>

    <section id="quoteSection">
      <h2>Daily Quote</h2>
      <blockquote id="quote"></blockquote>
      <p id="author"></p>
    </section>
  </div>

  <script src="main.js" type="module"></script>
</body>
</html>
