<!-- This is index.html -->
<!-- Part 1: HTML -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Forecast</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js" defer></script>
  <script src="main.js" defer></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>Weather Forecast Dashboard</h1>
      <p>Up-to-date info using meteo.lt API</p>
    </header>

    <section class="location-selector">
      <h2>Select City</h2>
      <div class="location-form">
        <select id="place-select">
          <!-- Dynamically populated -->
        </select>
        <button id="get-weather-btn">Get Weather</button>
      </div>
    </section>

    <section class="weather-display" id="weather-container">
      <div id="loading-indicator">Please select a city</div>
      <div id="weather-content" style="display: none;">
        <div class="current-weather">
          <div class="weather-info">
            <h2 id="location-name">Vilnius</h2>
            <p id="current-date"></p>
            <div class="temperature" id="current-temp"></div>
            <div class="weather-condition">
              <img id="current-condition-icon" alt="icon" class="condition-icon">
              <p id="current-condition"></p>
            </div>
          </div>
          <div class="weather-details">
            <div class="detail-item">
              <span class="detail-label">Feels Like</span>
              <span id="feels-like"></span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Wind</span>
              <span id="wind-speed"></span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Humidity</span>
              <span id="humidity"></span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Precipitation</span>
              <span id="precipitation"></span>
            </div>
          </div>
        </div>

        <div class="forecast-tabs">
          <button class="tab-button active" data-tab="daily">7-Day</button>
          <button class="tab-button" data-tab="hourly">24-Hour</button>
          <button class="tab-button" data-tab="chart">Chart</button>
        </div>

        <div id="daily-tab" class="forecast-content active">
          <div id="daily-forecast-container" class="daily-forecast"></div>
        </div>

        <div id="hourly-tab" class="forecast-content">
          <div class="hourly-forecast">
            <div id="hourly-forecast-container" class="hourly-items"></div>
          </div>
        </div>

        <div id="chart-tab" class="forecast-content">
          <canvas id="temperature-chart"></canvas>
        </div>
      </div>
    </section>

    <footer>
      <p>Powered by <a href="https://meteo.lt" target="_blank">meteo.lt</a></p>
    </footer>
  </div>
</body>
</html>
